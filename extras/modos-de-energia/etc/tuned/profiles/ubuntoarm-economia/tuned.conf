# UbuntoARM (IdeaPad 5 2-in-1 83GH, X1P42100): Economia: sem boost, CPU até 1,92 GHz, GPU até 666 MHz
[main]
summary=Economia: sem boost, CPU até 1,92 GHz, GPU até 666 MHz

[sysfs]
# boost antes do máximo: com boost ligado o kernel libera 3417600 kHz nos núcleos 4-7
/sys/devices/system/cpu/cpufreq/boost=0
/sys/devices/system/cpu/cpufreq/policy*/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq=1920000
/sys/class/devfreq/3d00000.gpu/max_freq=666000000
