# UbuntoARM (IdeaPad 5 2-in-1 83GH, X1P42100): Desempenho: boost até 3,42 GHz, GPU completa
[main]
summary=Desempenho: boost até 3,42 GHz, GPU completa

[sysfs]
# boost antes do máximo: com boost ligado o kernel libera 3417600 kHz nos núcleos 4-7
/sys/devices/system/cpu/cpufreq/boost=1
/sys/devices/system/cpu/cpufreq/policy*/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq=3417600
/sys/class/devfreq/3d00000.gpu/max_freq=1107000000
