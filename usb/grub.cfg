set timeout=10

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set cmdline=
smbios --type 4 --get-string 5 --set proc_version
regexp "Snapdragon.*" "$proc_version"
if [ $? = 0 ]; then
  # Work around Snapdragon X firmware bug. cutmem is not allowed in lockdown mode.
  if [ $lockdown != "y" ]; then
    cutmem 0x8800000000 0x8fffffffff
  fi
  # arm64.nopauth works around 8cx Gen 3 firmware bug
  cmdline="clk_ignore_unused pd_ignore_unused arm64.nopauth"
fi

# UbuntoARM: vmlinuz.h4 = kernel do Ubuntu + DTB híbrido do 83GH (com câmera); initrd.qnoc = módulo
# de interconexão corrigido + firmware do Windows + firmware da GPU. Secure Boot precisa estar desligado.
menuentry "Ubuntu - IdeaPad 5 2-in-1 (83GH)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz.h4 $cmdline --- quiet splash console=tty0
    initrd /casper/initrd.qnoc
}
menuentry "Ubuntu 83GH - modo texto (diagnostico)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz.h4 $cmdline panic=0 ignore_loglevel --- console=tty0
    initrd /casper/initrd.qnoc
}
menuentry "Versao anterior (sem camera)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz.h3 $cmdline --- quiet splash console=tty0
    initrd /casper/initrd.qnoc
}
menuentry "Reserva: DTB do Slim 5x (sem teclado/touch/som)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz.slim5x $cmdline --- quiet splash console=tty0
    initrd /casper/initrd.qnoc
}
menuentry 'Boot from next volume' {
    exit 1
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
